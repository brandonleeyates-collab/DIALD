<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIALD — Movie Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#211A13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DIALD">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #211A13;
    --bg-raised: #2C2318;
    --bg-raised-2: #362B1D;
    --text: #F2E6D2;
    --text-dim: #A8987E;
    --text-faint: #7C6E58;
    --accent: #E07A3D;
    --accent-dim: #B85F2C;
    --accent-bright: #F09258;
    --sage: #6FA3AE;
    --gold: #E3B94A;
    --olive: #B9AE71;
    --divider: #3D3120;
    --divider-soft: #332A1B;
    --danger: #C2604A;

    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 14px;
    --radius-pill: 999px;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.25), 0 1px 1px rgba(0,0,0,0.15);
    --shadow-md: 0 6px 16px rgba(0,0,0,0.32);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.45);

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --fast: 140ms;
    --med: 220ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(224,122,61,0.06), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(111,163,174,0.05), transparent 40%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .display {
    font-family: 'Archivo Black', sans-serif;
    letter-spacing: 0.005em;
  }

  #root { max-width: 900px; margin: 0 auto; padding: 28px 20px 100px; }

  /* Header / branding */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 20px;
    margin-bottom: 28px;
    position: relative;
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--sage), var(--olive), var(--gold), var(--accent));
    border-radius: 2px;
    opacity: 0.9;
  }
  .logo-wordmark {
    font-size: 40px;
    line-height: 0.95;
    letter-spacing: -0.01em;
  }
  .logo-d { color: var(--accent); }
  .tagline {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 700;
  }
  .tagline-your { color: var(--sage); }
  .tagline-diald { color: var(--accent); margin-left: 5px; }
  .stats {
    text-align: right;
    font-size: 12.5px;
    color: var(--text-dim);
    padding-top: 2px;
  }
  .stats strong {
    color: var(--accent);
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    display: block;
    font-variant-numeric: tabular-nums;
    margin-bottom: 2px;
  }

  /* Tabs — segmented control */
  .tabs {
    display: flex;
    gap: 3px;
    margin-bottom: 26px;
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    border-radius: var(--radius-pill);
    padding: 4px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: fit-content;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    cursor: pointer;
    border-radius: var(--radius-pill);
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: #211A13;
    background: var(--accent);
    box-shadow: var(--shadow-sm);
  }

  /* Search */
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"], select {
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    color: var(--text);
    padding: 11px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    border-radius: var(--radius-md);
    transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  }
  input[type="text"] { flex: 1; }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(224,122,61,0.14);
  }
  input[type="text"]::placeholder { color: var(--text-faint); }

  button { font-family: 'Inter', sans-serif; }

  button.primary {
    background: var(--accent);
    color: #211A13;
    border: none;
    padding: 11px 20px;
    font-weight: 700;
    font-size: 14px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background var(--fast) var(--ease), transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
    box-shadow: var(--shadow-sm);
  }
  button.primary:hover { background: var(--accent-bright); box-shadow: var(--shadow-md); }
  button.primary:active { transform: scale(0.97); }
  button.primary:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  button.primary, button.ghost, .card button.log-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button.ghost {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: border-color var(--fast) var(--ease), color var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  button.ghost:hover { border-color: var(--text-dim); color: var(--text); background: rgba(255,255,255,0.02); }
  button.ghost:active { transform: scale(0.97); }
  button.ghost:disabled { opacity: 0.5; cursor: default; }

  /* Grid of results/log */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--bg-raised);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--divider);
    box-shadow: var(--shadow-sm);
    transition: transform var(--med) var(--ease), box-shadow var(--med) var(--ease), border-color var(--med) var(--ease);
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: var(--divider-soft);
  }
  .card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
    background: var(--divider);
    transition: opacity var(--med) var(--ease);
  }
  .poster-wrap { position: relative; cursor: pointer; }
  .poster-wrap img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--divider); border-radius: inherit; }
  .badge-tmdb {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(15,11,7,0.82);
    backdrop-filter: blur(3px);
    border-radius: var(--radius-sm);
    padding: 3px 7px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 12px;
    line-height: 1;
  }
  .badge-tmdb.tier-high { color: #8FCB7E; }
  .badge-tmdb.tier-mid { color: var(--gold); }
  .badge-tmdb.tier-low { color: var(--text-dim); }
  .badge-user {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--accent);
    color: #211A13;
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 12.5px;
    line-height: 1;
    box-shadow: var(--shadow-sm);
  }
  .card-body { padding: 12px; }
  .card-title { font-size: 13px; font-weight: 700; line-height: 1.35; margin-bottom: 3px; }
  .card-year { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
  .card-rating {
    font-family: 'Archivo Black', sans-serif;
    font-size: 17px;
    color: var(--accent);
  }
  .card button.log-btn {
    width: 100%;
    margin-top: 8px;
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    padding: 7px;
    font-size: 11.5px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  .card button.log-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Cert badge */
  .cert-badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    border: 1px solid var(--divider);
    border-radius: var(--radius-sm);
    padding: 1.5px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Platform badges */
  .platform-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
  .platform-chip {
    font-size: 10px;
    font-weight: 700;
    color: var(--sage);
    border: 1px solid rgba(111,163,174,0.4);
    border-radius: var(--radius-pill);
    padding: 3px 9px;
    cursor: pointer;
    background: rgba(111,163,174,0.08);
    transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
  }
  .platform-chip:hover { background: rgba(111,163,174,0.22); border-color: var(--sage); }
  .platform-chip.none { color: var(--text-faint); border-color: var(--divider); cursor: default; background: none; }

  /* Log list view */
  .log-row {
    display: flex;
    gap: 14px;
    padding: 13px 8px;
    border-bottom: 1px solid var(--divider-soft);
    align-items: center;
    border-radius: var(--radius-md);
    transition: background var(--fast) var(--ease);
  }
  .log-row:hover { background: rgba(255,255,255,0.015); }
  .log-row img {
    width: 46px; height: 69px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    background: var(--divider);
    box-shadow: var(--shadow-sm);
  }
  .log-row-title { font-weight: 700; font-size: 14px; }
  .log-row-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .log-row-rating {
    font-family: 'Archivo Black', sans-serif;
    font-size: 21px;
    color: var(--accent);
    margin-left: auto;
    padding-right: 12px;
  }
  .log-row .remove-btn {
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 17px;
    padding: 5px 9px;
    border-radius: var(--radius-sm);
    transition: color var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  .log-row .remove-btn:hover { color: var(--danger); background: rgba(194,96,74,0.1); }

  /* Empty state */
  .empty { text-align: center; padding: 64px 20px; color: var(--text-dim); }
  .empty .display { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .empty > div:last-child { font-size: 13.5px; line-height: 1.5; max-width: 340px; margin: 0 auto; }

  /* Modals */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,7,4,0.7);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
    animation: overlayIn var(--med) var(--ease);
  }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    border-radius: var(--radius-lg);
    padding: 26px;
    max-width: 380px;
    width: 100%;
    position: relative;
    box-shadow: var(--shadow-lg);
    animation: modalIn var(--med) var(--ease);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal h3 { font-size: 20px; margin-bottom: 4px; }
  .modal .modal-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .modal label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; margin-top: 14px; }
  .rating-input-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
  .rating-display {
    font-family: 'Archivo Black', sans-serif;
    font-size: 26px;
    color: var(--accent);
    min-width: 56px;
    font-variant-numeric: tabular-nums;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 24px; }
  .modal-actions button { flex: 1; }

  .modal-close-x {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(255,255,255,0.04);
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 7px;
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  .modal-close-x:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  /* Cast */
  .cast-section-label { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 9px; margin-top: 16px; }
  .cast-person { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .cast-photo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--divider); border: 1px solid var(--divider-soft); }
  .cast-role { font-size: 12px; color: var(--text-dim); }
  .cast-chip {
    font-size: 12.5px; font-weight: 600;
    background: var(--bg);
    border: 1px solid var(--divider);
    border-radius: var(--radius-pill);
    padding: 4px 11px;
    color: var(--text);
    cursor: pointer;
    transition: border-color var(--fast) var(--ease), color var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  .cast-chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(224,122,61,0.06); }

  /* Quiz / filters */
  .quiz-card {
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    border-radius: var(--radius-lg);
    padding: 26px;
    box-shadow: var(--shadow-sm);
  }
  .quiz-step { margin-bottom: 24px; }
  .quiz-step label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-dim); margin-bottom: 10px; }
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    padding: 8px 15px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color var(--fast) var(--ease), color var(--fast) var(--ease), background var(--fast) var(--ease), transform var(--fast) var(--ease);
  }
  .pill:hover { border-color: var(--text-dim); }
  .pill:active { transform: scale(0.96); }
  .pill.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(224,122,61,0.12);
  }

  .services-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

  .rec-card {
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    gap: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--med) var(--ease), border-color var(--med) var(--ease);
  }
  .rec-card:hover { box-shadow: var(--shadow-md); border-color: var(--divider-soft); }
  .rec-card img { width: 80px; height: 120px; object-fit: cover; border-radius: var(--radius-md); flex-shrink: 0; background: var(--divider); box-shadow: var(--shadow-sm); }
  .rec-title { font-size: 18px; font-weight: 700; font-family: 'Archivo Black', sans-serif; }
  .rec-meta { font-size: 12px; color: var(--text-dim); margin: 5px 0 9px; }
  .rec-predicted {
    display: inline-block;
    background: rgba(224,122,61,0.15);
    color: var(--accent);
    font-family: 'Archivo Black', sans-serif;
    font-size: 13.5px;
    padding: 3px 9px;
    border-radius: var(--radius-sm);
    margin-bottom: 9px;
  }
  .rec-why { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

  .loading { text-align: center; padding: 48px; color: var(--text-dim); font-size: 13.5px; }

  .setup-notice {
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    border-left: 3px solid var(--accent-dim);
    border-radius: var(--radius-md);
    padding: 15px 18px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .setup-notice strong { color: var(--text); }
  .setup-notice input { margin-top: 10px; width: 100%; }

  .see-more-row { text-align: center; margin-top: 18px; }

  /* Autocomplete */
  .search-row { position: relative; }
  .autocomplete-dropdown {
    position: absolute;
    top: 100%; left: 0; right: 76px;
    background: var(--bg-raised-2);
    border: 1px solid var(--divider);
    border-radius: var(--radius-md);
    max-height: 280px;
    overflow-y: auto;
    z-index: 30;
    margin-top: 6px;
    box-shadow: var(--shadow-lg);
    animation: dropIn var(--fast) var(--ease);
  }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .autocomplete-item {
    padding: 9px 11px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: background var(--fast) var(--ease);
  }
  .autocomplete-item:hover { background: rgba(255,255,255,0.04); }
  .autocomplete-item img { width: 30px; height: 30px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; background: var(--divider); }
  .autocomplete-item .ac-sub { color: var(--text-dim); font-size: 11px; }

  /* Scroll to top */
  .scroll-top-btn {
    position: fixed;
    bottom: 26px; right: 26px;
    background: var(--accent);
    color: #211A13;
    border: none;
    width: 48px; height: 48px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    z-index: 45;
    transition: background var(--fast) var(--ease), transform var(--fast) var(--ease);
    animation: popIn var(--med) var(--ease);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
  .scroll-top-btn:hover { background: var(--accent-bright); transform: translateY(-2px); }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--divider-soft); }
</style>
</head>
<body>
<div id="root"></div>
