<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIALD — Movie Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #211A13;
    --bg-raised: #2C2318;
    --text: #F2E6D2;
    --text-dim: #B8A489;
    --accent: #E07A3D;
    --accent-dim: #B85F2C;
    --sage: #6FA3AE;
    --gold: #E3B94A;
    --olive: #B9AE71;
    --divider: #3D3120;
    --danger: #C2604A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .display {

    letter-spacing: 0.01em;
  }

  #root { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

  /* Header */
  .header {

    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px solid var(--sage);
    border-image: linear-gradient(90deg, var(--sage), var(--olive), var(--gold), var(--accent)) 1;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 32px;
    line-height: 1;
  }
  .header .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }
  .stats {
    text-align: right;
    font-size: 13px;
    color: var(--text-dim);
  }
  .stats strong {
    color: var(--accent);
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    display: block;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--divider);
    flex-wrap: wrap;
  }
  .tab {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transform: translateY(1px);
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* Search */
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"], select {
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    color: var(--text);
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    border-radius: 3px;
  }
  input[type="text"] {
    flex: 1;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  button.primary {
    background: var(--accent);
    color: #211A13;
    border: none;
    padding: 10px 18px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border-radius: 3px;
    cursor: pointer;
  }
  button.primary:hover { background: #EA8E58; }
  button.ghost {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--text-dim); color: var(--text); }

    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
  }
  .card {

    border-radius: 4px;

    border: 1px solid var(--divider);
  }

    object-fit: cover;
    display: block;
    background: var(--divider);
  }
  .card-body {
    padding: 10px;
  }
  .card-title {

    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .card-year {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .card-rating {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    color: var(--accent);
  }

    margin-top: 8px;
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    padding: 6px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;

    font-weight: 700;
    color: var(--text-dim);
    border: 1px solid var(--divider);
    border-radius: 3px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;

    font-size: 18px;
    padding: 4px 8px;

  .log-row .remove-btn:hover { color: var(--danger); }

    color: var(--text-dim);

  .empty .display { font-size: 24px; color: var(--text); margin-bottom: 8px; }

    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal {
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    border-radius: 6px;
    padding: 24px;
    max-width: 380px;
    width: 100%;

    font-weight: 600;
    color: var(--text-dim);

    border-radius: 3px;

  .rec-why { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

    border: 1px solid var(--accent-dim);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .setup-notice strong { color: var(--text); }
  .setup-notice input { margin-top: 10px; width: 100%; }

  .see-more-row { text-align: center; margin-top: 16px; }

  /* Autocomplete */
  .search-row { position: relative; }
  .autocomplete-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 76px;
    background: var(--bg-raised);
    border: 1px solid var(--divider);
    border-radius: 4px;
    max-height: 280px;
    overflow-y: auto;
    z-index: 30;
    margin-top: 4px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  .autocomplete-item {
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .autocomplete-item:hover { background: var(--bg); }
  .autocomplete-item img {
    width: 30px;
    height: 30px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--divider);
  }
  .autocomplete-item .ac-sub { color: var(--text-dim); font-size: 11px; }

  .scroll-top-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #211A13;
    border: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    z-index: 45;
  }
  .scroll-top-btn:hover { background: #EA8E58; }

  /* Modal close X */
  .modal { position: relative; }
  .modal-close-x {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 6px;
  }
  .modal-close-x:hover { color: var(--text); }

  /* Cast section with photos */
  .cast-section-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 8px;
    margin-top: 14px;
  }
  .cast-person {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .cast-photo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--divider);
  }
  .cast-role {
    font-size: 12px;
    color: var(--text-dim);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
</style>
</head>
