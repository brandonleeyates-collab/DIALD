<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    --text: #F2EEE7;
    --text-dim: #A89F92;
    --accent: #C4841D;

  }

  .display {

    margin-bottom: 24px;

    line-height: 1;

    font-size: 13px;
    margin-top: 4px;
  }

    font-size: 13px;
    color: var(--text-dim);
  }
  .stats strong {

    font-size: 20px;
    font-weight: 700;
    display: block;

    border: none;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);

    gap: 8px;

    font-size: 14px;
    border-radius: 3px;

    border: none;
    padding: 10px 18px;

    font-size: 14px;
    border-radius: 3px;

    color: var(--text-dim);
    padding: 10px 16px;

    font-size: 13px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;

    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--divider);

    object-fit: cover;
    display: block;
    background: #2A2622;

    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 2px;

  .card-year {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .card-rating {

    font-size: 18px;
    font-weight: 700;
    color: var(--accent);

    margin-top: 8px;
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    padding: 6px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 3px;

    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 6px;
    margin-top: 14px;

    font-weight: 700;
    color: var(--accent);

    display: flex;
    gap: 8px;
    margin-top: 24px;

    padding: 24px;

    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 8px;
